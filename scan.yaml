- name: Scan
  hosts: webservers
  become: yes
  become_method: sudo
  remote_user: runner

  tasks:
    - name: Install NMAP
      ansible.builtin.apt:
        name: nmap
        state: latest
        update_cache: yes

    - name: Copy nmap
      ansible.builtin.copy:
        src: ./targets.txt
        dest: ~/targets.txt
        force: yes
        mode: '0644'

    - name: Run nmap
      ansible.builtin.shell: "nmap -iL ~/targets.txt -p 80 -oG -"
      register: nmap_results

    - name: Nmap output
      ansible.builtin.debug:
        msg: "{{ nmap_results.stdout_lines }}"